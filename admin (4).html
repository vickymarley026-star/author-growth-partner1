<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>*{box-sizing:border-box}body{font:14px system-ui;margin:0;background:#f4f1fa;color:#1d1530}.lay{display:flex;min-height:100vh}aside{width:210px;background:#150d33;color:#fff;padding:14px 10px;flex-shrink:0}aside a{display:flex;justify-content:space-between;color:#cfc8ea;padding:9px 12px;border-radius:8px;cursor:pointer;text-decoration:none}aside a.on,aside a:hover{background:#2a1d63;color:#fff}aside i{background:#f97316;color:#fff;border-radius:99px;padding:0 7px;font-style:normal;font-size:11px}.lg{display:block;padding:8px 12px 16px;font-size:17px}main{flex:1;padding:22px;max-width:980px}h2{margin:0 0 14px}button{border:0;border-radius:8px;padding:8px 14px;cursor:pointer;background:#f97316;color:#fff;font-weight:600}button.g{background:#ddd;color:#222}button.r{background:#dc2626}.c{background:#fff;border-radius:12px;padding:16px;margin:12px 0}.g4{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.g4 .c{margin:0}.g4 h3{margin:6px 0 0;font-size:22px}input,textarea,select{width:100%;padding:8px;margin:4px 0 10px;border:1px solid #ccc;border-radius:6px;font:inherit}label{font-size:12px;color:#555;display:block}.row{display:flex;justify-content:space-between;gap:10px;align-items:center;border-bottom:1px solid #eee;padding:8px 0}.ib{display:grid;grid-template-columns:260px 1fr;gap:12px}.th{cursor:pointer}.msgs{max-height:380px;overflow:auto;margin-bottom:10px}.b{max-width:80%;padding:8px 12px;border-radius:12px;margin:6px 0;background:#eee}.b.admin{background:#f97316;color:#fff;margin-left:auto}.ava{width:28px;height:28px;border-radius:50%;object-fit:cover;background:#f97316;color:#fff;display:inline-grid;place-items:center;font-style:normal;font-weight:600;font-size:12px;flex-shrink:0}.mi{max-width:260px;border-radius:8px;display:block}.of{background:#fff8f1;border:1px solid #f97316;border-radius:10px;padding:10px;min-width:220px;color:#1d1530}.of h4{margin:4px 0}.ofm{display:flex;gap:10px;flex-wrap:wrap;font-weight:600}.tb{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}.tb select{width:auto;margin:0}.b a{color:inherit}.b small{display:block;opacity:.7;font-size:10px}@media(max-width:760px){.lay{flex-direction:column}aside{width:100%;display:flex;flex-wrap:wrap}.ib{grid-template-columns:1fr}}</style></head><body><div id="app"></div>
<script>
var URL_='YOUR_SUPABASE_URL',KEY='YOUR_ANON_KEY',sb=supabase.createClient(URL_,KEY),app=document.getElementById('app'),V='dash',TH=null,RT=0;
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var T={posts:{label:'Blog',f:['title','category','excerpt','!body','image_url','read_min','?published'],show:'title'},projects:{label:'Portfolio',f:['title','kind','image_url','sort'],show:'title'},reviews:{label:'Reviews',f:['name','role','book','rating','!text','?approved'],show:'name'},replies:{label:'Quick replies',f:['title','!body','sort'],show:'title',tbl:'quick_replies'},users:{label:'Users',f:['display_name'],show:'display_name',tbl:'profiles'},products:{label:'Products',f:['name','plan','price_kobo','days','?active'],show:'name'},orders:{label:'Orders',f:['ref','email','amount_kobo','status','code'],show:'email'},codes:{label:'Codes',f:['code','status','expires_at','order_ref'],show:'code'}};
var NAV=[['dash','Dashboard'],['inbox','Inbox'],['notifs','Notifications'],['pages','Pages'],['text','Site text'],['set','Settings'],['sec','Security']].concat(Object.keys(T).map(function(k){return[k,T[k].label]}));
var FAILS=0,LOCK=0,IDLE=null;
function idle(){clearTimeout(IDLE);IDLE=setTimeout(function(){sb.auth.signOut().then(function(){login('Signed out after 30 minutes of inactivity.')})},18e5)}
['click','keydown','mousemove','touchstart'].forEach(function(ev){addEventListener(ev,function(){if(app.querySelector('.lay'))idle()},{passive:true})});
async function init(){var s=(await sb.auth.getSession()).data.session;if(!s)return login();
var a=await sb.rpc('is_admin_user');if(a.error||!a.data){await sb.auth.signOut();return login('This account is not an administrator.')}
var l=(await sb.auth.mfa.getAuthenticatorAssuranceLevel()).data||{};if(l.nextLevel=='aal2'&&l.currentLevel!='aal2')return mfaPrompt();
shell();rt();idle()}
function login(msg){app.innerHTML='<main style="max-width:380px"><div class="c"><h2>Admin login</h2>'+(msg?'<p style="color:#b45309">'+esc(msg)+'</p>':'')+'<label>Email</label><input id=e type=email autocomplete=username><label>Password</label><input id=p type=password autocomplete=current-password onkeydown="if(event.key==\'Enter\')go()"><button onclick="go()">Log in</button> <span id=m></span></div></main>'}
async function go(){if(Date.now()<LOCK){$('m').textContent='Too many attempts. Wait '+Math.ceil((LOCK-Date.now())/1000)+'s.';return}
var r=await sb.auth.signInWithPassword({email:$('e').value.trim(),password:$('p').value});
if(r.error){FAILS++;if(FAILS>=5){LOCK=Date.now()+60000;FAILS=0}$('m').textContent='Wrong email or password.';return}FAILS=0;init()}
async function mfaPrompt(){var f=((await sb.auth.mfa.listFactors()).data||{}).totp||[],fa=f.filter(function(x){return x.status=='verified'})[0];window._fid=fa&&fa.id;
app.innerHTML='<main style="max-width:380px"><div class=c><h2>Two-factor code</h2><p>Enter the 6-digit code from your authenticator app.</p><input id=mc inputmode=numeric maxlength=6 onkeydown="if(event.key==\'Enter\')mfaGo()"><button onclick="mfaGo()">Verify</button> <button class=g onclick="sb.auth.signOut().then(init)">Cancel</button> <span id=m></span></div></main>'}
async function mfaGo(){var c=await sb.auth.mfa.challenge({factorId:_fid});if(c.error){$('m').textContent=c.error.message;return}var v=await sb.auth.mfa.verify({factorId:_fid,challengeId:c.data.id,code:$('mc').value.trim()});if(v.error){$('m').textContent='Wrong code.';return}init()}
async function security(){var f=((await sb.auth.mfa.listFactors()).data||{}).totp||[],ok=f.some(function(x){return x.status=='verified'});
$('mn').innerHTML='<h2>Security</h2><div class=c><b>Two-factor authentication</b><p>'+(ok?'Enabled. A code from your authenticator app is needed at every login.':'Not enabled. Turn it on so a leaked password alone cannot open your admin.')+'</p>'+(ok?'':'<button onclick="mfaEnroll()">Enable two-factor</button>')+'<div id=mq></div></div><div class=c><b>Change password</b><label>New password (at least 12 characters)</label><input id=np type=password><button onclick="chpw()">Update password</button></div><div class=c><b>Sessions</b><p>You are signed out automatically after 30 minutes of inactivity.</p><button class=g onclick="sb.auth.signOut({scope:\'global\'}).then(init)">Sign out on all devices</button></div>'}
async function mfaEnroll(){var r=await sb.auth.mfa.enroll({factorType:'totp'});if(r.error){alert(r.error.message);return}window._fid=r.data.id;$('mq').innerHTML='<p>Scan this with Google Authenticator or Authy, or type the secret <code>'+esc(r.data.totp.secret)+'</code></p><img src="'+esc(r.data.totp.qr_code)+'" width=180 alt="QR code"><br><label>Enter the 6-digit code to confirm</label><input id=mc maxlength=6><button onclick="mfaOk()">Confirm</button>'}
async function mfaOk(){var c=await sb.auth.mfa.challenge({factorId:_fid});if(c.error){alert(c.error.message);return}var v=await sb.auth.mfa.verify({factorId:_fid,challengeId:c.data.id,code:$('mc').value.trim()});if(v.error)alert('Wrong code');else{alert('Two-factor enabled');security()}}
async function chpw(){var p=$('np').value;if(p.length<12){alert('Use at least 12 characters');return}var r=await sb.auth.updateUser({password:p});alert(r.error?r.error.message:'Password updated')}
function rt(){if(RT)return;RT=1;sb.channel('rt').on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},function(){side();if(V=='inbox'&&!document.activeElement.id)inbox()}).on('postgres_changes',{event:'INSERT',schema:'public',table:'notifications'},side).subscribe()}
async function side(){var a=await sb.from('threads').select('id',{count:'exact',head:true}).eq('unread',true),b=await sb.from('notifications').select('id',{count:'exact',head:true}).eq('read',false),bd={inbox:a.count,notifs:b.count};
$('sd').innerHTML='<b class=lg>Admin</b>'+NAV.map(function(n){return'<a class="'+(V==n[0]?'on':'')+'" onclick="V=\''+n[0]+'\';shell()">'+n[1]+(bd[n[0]]?' <i>'+bd[n[0]]+'</i>':'')+'</a>'}).join('')+'<a href="/" target=_blank>View site &#8599;</a><a onclick="sb.auth.signOut().then(init)">Log out</a>'}
function shell(){app.innerHTML='<div class=lay><aside id=sd></aside><main id=mn></main></div>';side();view()}
function view(){if(T[V])return crud();({dash:dash,inbox:inbox,notifs:notifs,pages:pages,text:text,set:settings,sec:security})[V]()}
async function dash(){var o=(await sb.from('orders').select('amount_kobo').eq('status','paid')).data||[],pr=await sb.from('reviews').select('id',{count:'exact',head:true}).eq('approved',false),ps=await sb.from('posts').select('id',{count:'exact',head:true}),n=(await sb.from('notifications').select('*').order('created_at',{ascending:false}).limit(8)).data||[],rev=o.reduce(function(a,x){return a+(x.amount_kobo||0)},0)/100;
$('mn').innerHTML='<h2>Dashboard</h2><div class=g4>'+[['Revenue','₦'+rev.toLocaleString()],['Paid orders',o.length],['Reviews to approve',pr.count||0],['Blog posts',ps.count||0]].map(function(c){return'<div class=c><small>'+c[0]+'</small><h3>'+c[1]+'</h3></div>'}).join('')+'</div><div class=c><b>Recent activity</b>'+(n.map(function(x){return'<div class=row><span>'+esc(x.title)+'<br><small>'+esc(x.body)+'</small></span><small>'+new Date(x.created_at).toLocaleString()+'</small></div>'}).join('')||'<p>Nothing yet</p>')+'</div>'}
async function inbox(){var t=(await sb.from('threads').select('*').order('last_at',{ascending:false})).data||[],ids=t.map(function(x){return x.user_id}).filter(Boolean),PP={};
if(ids.length)((await sb.from('profiles').select('id,display_name,avatar_url').in('id',ids)).data||[]).forEach(function(p){PP[p.id]=p});
$('mn').innerHTML='<h2>Inbox</h2><div class=ib><div class=c>'+(t.map(function(x){var p=PP[x.user_id]||{},n=p.display_name||x.name||'Member';return'<div class="row th" onclick="openT(\''+x.id+'\')"><span style="display:flex;gap:8px;align-items:center">'+(p.avatar_url&&p.avatar_url.indexOf('data:image/')==0?'<img class=ava src="'+esc(p.avatar_url)+'">':'<i class=ava>'+esc(n.charAt(0).toUpperCase())+'</i>')+'<span>'+(x.unread?'&#9679; ':'')+esc(n)+'<br><small>'+esc(x.email||'')+'</small></span></span></div>'}).join('')||'No messages yet')+'</div><div class=c id=cv>Select a conversation</div></div>';if(TH)openT(TH,1)}
function mh(x){var h='',im=(x.media_type||'').indexOf('image')==0;
if(x.kind=='offer'){var o=x.offer||{};h='<div class=of><small>CUSTOM OFFER</small><h4>'+esc(o.title)+'</h4><p>'+esc(o.description)+'</p><div class=ofm><span>'+esc(o.days)+' day(s)</span><span>'+esc(o.currency||'USD')+' '+esc(o.price)+'</span><span>'+esc((o.status||'pending').toUpperCase())+'</span></div></div>'}
else{if(x.media_url)h=im?'<a href="'+esc(x.media_url)+'" target=_blank><img class=mi src="'+esc(x.media_url)+'"></a>':'<a href="'+esc(x.media_url)+'" download="'+esc(x.body||'file')+'">&#128206; '+esc(x.body||'file')+'</a>';
if(x.body&&!(x.media_url&&!im))h+=(h?'<br>':'')+esc(x.body)}
return'<div class="b '+(x.sender=='admin'?'admin':'')+'">'+h+'<small>'+(x.kind=='auto'?'Auto-reply &middot; ':'')+new Date(x.created_at).toLocaleString()+'</small></div>'}
async function openT(id,keep){TH=id;var m=(await sb.from('messages').select('*').eq('thread_id',id).order('created_at')).data||[],q=(await sb.from('quick_replies').select('*').order('sort')).data||[];window._q=q;
$('cv').innerHTML='<div class=msgs id=ms>'+m.map(mh).join('')+'</div><div class=tb><select id=qr onchange="useq()"><option value="">Quick reply...</option>'+q.map(function(x,i){return'<option value="'+i+'">'+esc(x.title)+'</option>'}).join('')+'</select><button class=g onclick="$(\'fi\').click()">&#128206; Attach</button><button class=g onclick="offerForm()">+ Custom offer</button><input type=file id=fi style="display:none" onchange="attach(this)"></div><textarea id=rp rows=3 placeholder="Reply..."></textarea><button onclick="reply()">Send</button><div id=of></div>';
var ms=$('ms');ms.scrollTop=ms.scrollHeight;await sb.from('threads').update({unread:false}).eq('id',id);if(!keep)side()}
function useq(){var i=$('qr').value;if(i!=='')$('rp').value=_q[+i].body;$('qr').value=''}
async function reply(){var b=$('rp').value.trim();if(!b)return;await sb.from('messages').insert({thread_id:TH,sender:'admin',body:b});openT(TH,1)}
function readF(f,cb){if(f.size>1.5e6&&f.type.indexOf('image')<0){alert('Files must be under 1.5 MB');return}
if(f.type.indexOf('image')==0){var im=new Image;im.onload=function(){var s=Math.min(1,1200/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.8),'image/jpeg')};im.src=URL.createObjectURL(f)}else{var r=new FileReader;r.onload=function(){cb(r.result,f.type||'application/octet-stream')};r.readAsDataURL(f)}}
async function attach(el){var f=el.files[0];if(!f)return;readF(f,async function(u,t){var r=await sb.from('messages').insert({thread_id:TH,sender:'admin',kind:'media',body:f.name,media_url:u,media_type:t});if(r.error)alert(r.error.message);openT(TH,1)})}
function offerForm(){$('of').innerHTML='<div class=c><b>Custom offer</b><label>Project title</label><input id=ot><label>Description</label><textarea id=od rows=3></textarea><label>Timeline (days)</label><input id=oy type=number value=7><label>Price</label><input id=op type=number><label>Currency</label><select id=oc><option>USD</option><option>NGN</option></select><button onclick="sendOffer()">Send offer</button></div>'}
async function sendOffer(){var o={title:$('ot').value,description:$('od').value,days:+$('oy').value,price:+$('op').value,currency:$('oc').value,status:'pending'};if(!o.title||!o.price){alert('Add a title and a price');return}var r=await sb.from('messages').insert({thread_id:TH,sender:'admin',kind:'offer',body:o.title,offer:o});if(r.error)alert(r.error.message);openT(TH,1)}
async function notifs(){var n=(await sb.from('notifications').select('*').order('created_at',{ascending:false}).limit(100)).data||[];
$('mn').innerHTML='<h2>Notifications</h2><div class=c><button onclick="allread()">Mark all as read</button></div><div class=c>'+(n.map(function(x){return'<div class=row><span>'+(x.read?'':'&#9679; ')+'<b>'+esc(x.title)+'</b><br><small>'+esc(x.body)+'</small></span><small>'+new Date(x.created_at).toLocaleString()+'</small></div>'}).join('')||'Nothing yet')+'</div>'}
async function allread(){await sb.from('notifications').update({read:true}).eq('read',false);side();notifs()}
async function pages(){var d=(await sb.from('pages').select('*').order('sort')).data||[];window._pl=d;
$('mn').innerHTML='<h2>Pages</h2><div class=c><button onclick="pedit()">+ New page</button> <small>A page with slug "team" appears at yoursite/#team</small></div><div class=c>'+(d.map(function(x,i){return'<div class=row><span>'+esc(x.title)+' <small>#'+esc(x.slug)+'</small></span><span><button class=g onclick="pedit('+i+')">Edit</button> <button class=r onclick="pdel('+i+')">Delete</button></span></div>'}).join('')||'No pages yet')+'</div>'}
function pedit(i){window._pg=i==null?{title:'',slug:'',blocks:[],published:true,in_nav:true,sort:0}:JSON.parse(JSON.stringify(_pl[i]));prender()}
function cap(){var x=_pg;if(!$('pt'))return;x.title=$('pt').value;x.slug=$('ps').value;x.in_nav=$('pn').checked;x.published=$('pp').checked}
function prender(){var x=_pg,ty=['hero','text','cards','image','button','html'];
$('mn').innerHTML='<h2>'+(x.id?'Edit':'New')+' page</h2><div class=c><label>Title</label><input id=pt value="'+esc(x.title)+'"><label>Slug (letters, numbers, hyphens)</label><input id=ps value="'+esc(x.slug)+'"><label><input type=checkbox id=pn '+(x.in_nav?'checked':'')+' style="width:auto"> Show in menu</label><label><input type=checkbox id=pp '+(x.published?'checked':'')+' style="width:auto"> Published</label></div>'+
x.blocks.map(function(b,k){return'<div class=c><div class=row><b>Block '+(k+1)+'</b><span><button class=g onclick="bmv('+k+',-1)">&#8593;</button> <button class=g onclick="bmv('+k+',1)">&#8595;</button> <button class=r onclick="bdel('+k+')">&#10005;</button></span></div><label>Type</label><select onchange="bset('+k+',\'type\',this.value)">'+ty.map(function(t){return'<option'+(b.type==t?' selected':'')+'>'+t+'</option>'}).join('')+'</select>'+
[['title','Title'],['body',b.type=='cards'?'Cards (one per line: Title | text)':b.type=='html'?'HTML':'Text'],['image','Image URL'],['label','Button label'],['link','Button link (e.g. #contact)']].map(function(f){return'<label>'+f[1]+'</label>'+(f[0]=='body'?'<textarea rows=4 onchange="bset('+k+',\'body\',this.value)">'+esc(b.body)+'</textarea>':'<input value="'+esc(b[f[0]])+'" onchange="bset('+k+',\''+f[0]+'\',this.value)">')}).join('')+'</div>'}).join('')+
'<div class=c><button class=g onclick="badd()">+ Add block</button></div><button onclick="psave()">Save page</button> <button class=g onclick="pages()">Cancel</button>'}
function bset(k,f,v){_pg.blocks[k][f]=v}
function badd(){cap();_pg.blocks.push({type:'text',title:'',body:''});prender()}
function bdel(k){cap();_pg.blocks.splice(k,1);prender()}
function bmv(k,d){cap();var b=_pg.blocks,j=k+d;if(j<0||j>=b.length)return;var t=b[k];b[k]=b[j];b[j]=t;prender()}
async function psave(){cap();var x=_pg;x.slug=x.slug.toLowerCase().replace(/[^a-z0-9-]/g,'-');var o={title:x.title,slug:x.slug,blocks:x.blocks,published:x.published,in_nav:x.in_nav,sort:x.sort||0},r=x.id?await sb.from('pages').update(o).eq('id',x.id):await sb.from('pages').insert(o);if(r.error)alert(r.error.message);else pages()}
async function pdel(i){if(confirm('Delete page?')){await sb.from('pages').delete().eq('id',_pl[i].id);pages()}}
async function cmap(){var C={};((await sb.from('content').select('*')).data||[]).forEach(function(x){C[x.key]=x.value});return C}
async function text(){$('mn').innerHTML='<h2>Site text</h2><p>Scanning your pages...</p>';var C=await cmap(),out='';window._tx=[];
for(var r of['home','about','services','tools','blog','portfolio','contact']){var f=document.createElement('iframe');f.style.cssText='position:absolute;left:-9999px;width:1200px;height:800px';f.src='/index.html?raw=1#'+r;document.body.appendChild(f);await new Promise(function(ok){f.onload=function(){setTimeout(ok,1200)}});
var d=f.contentDocument,seen={},w=d.createTreeWalker(d.body,NodeFilter.SHOW_TEXT),n,l=[];
while(n=w.nextNode()){if(n.parentNode.closest('script,style,noscript,textarea'))continue;var t=n.nodeValue.trim();if(t.length>1&&!seen[t]){seen[t]=1;l.push(t)}}
f.remove();out+='<div class=c><b>'+r.toUpperCase()+'</b>'+l.map(function(t){var i=_tx.push(t)-1;return'<label>'+esc(t.slice(0,80))+'</label><input data-i='+i+' value="'+esc(C['txt:'+t]!=null?C['txt:'+t]:t)+'">'}).join('')+'</div>'}
window._C=C;$('mn').innerHTML='<h2>Site text</h2><p>Edit any text on your site, then Save.</p><button onclick="tsave()">Save all</button>'+out+'<button onclick="tsave()">Save all</button>'}
async function tsave(){var ch={},keep={};document.querySelectorAll('input[data-i]').forEach(function(el){var o=_tx[+el.dataset.i];if(el.value!==o){if(!ch[o])ch[o]=el.value}else keep[o]=1});
for(var o in ch)await sb.from('content').upsert({key:'txt:'+o,value:ch[o]});
for(var k in _C)if(k.indexOf('txt:')==0){var o2=k.slice(4);if(!ch[o2]&&keep[o2])await sb.from('content').delete().eq('key',k)}
alert('Saved. Refresh your site to see changes.');text()}
async function settings(){var C=await cmap();$('mn').innerHTML='<h2>Settings</h2><div class=c><label>Accent colour</label><input type=color id=s1 value="'+(C['set:accent']||'#f97316')+'"><label>Announcement bar text (leave empty to hide)</label><input id=s2 value="'+esc(C['set:announcement']||'')+'"><button onclick="sset()">Save</button></div><div class=c><b>Auto-responder</b><br><label><input type=checkbox id=a1 '+(C['ar:enabled']=='1'?'checked':'')+' style="width:auto"> Reply automatically to a visitor who writes (once every 6 hours per visitor)</label><label>Auto-reply message</label><textarea id=a2 rows=4>'+esc(C['ar:message']||'Hi! Thanks for reaching out. I got your message and will reply within a few hours. Meanwhile, tell me about your book and your goals.')+'</textarea><button onclick="aset()">Save auto-responder</button></div>'}
async function sset(){await sb.from('content').upsert([{key:'set:accent',value:$('s1').value},{key:'set:announcement',value:$('s2').value}]);alert('Saved')}
async function aset(){await sb.from('content').upsert([{key:'ar:enabled',value:$('a1').checked?'1':'0'},{key:'ar:message',value:$('a2').value}]);alert('Saved')}
async function crud(){var t=T[V],r=await sb.from(T[V].tbl||V).select('*').limit(200),d=r.data||[];window._d=d;
$('mn').innerHTML='<h2>'+t.label+'</h2><div class=c><button onclick="edit()">+ New</button></div><div class=c>'+(r.error?esc(r.error.message):d.map(function(x,i){return'<div class=row><span>'+esc(x[t.show])+'</span><span><button class=g onclick="edit('+i+')">Edit</button> <button class=r onclick="del('+i+')">Delete</button></span></div>'}).join('')||'Nothing yet')+'</div>'}
