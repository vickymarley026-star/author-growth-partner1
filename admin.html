<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>body{font:14px system-ui;margin:0;background:#f4f1fa;color:#1d1530}header{background:#150d33;color:#fff;padding:12px 20px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}header b{margin-right:12px}button{border:0;border-radius:8px;padding:8px 14px;cursor:pointer;background:#f97316;color:#fff;font-weight:600}button.t{background:#33276a}button.t.on{background:#f97316}button.g{background:#ddd;color:#222}button.r{background:#dc2626}main{max-width:900px;margin:20px auto;padding:0 16px}.c{background:#fff;border-radius:12px;padding:16px;margin:12px 0}input,textarea,select{width:100%;padding:8px;margin:4px 0 10px;border:1px solid #ccc;border-radius:6px;font:inherit}label{font-size:12px;color:#555}.row{display:flex;justify-content:space-between;gap:10px;align-items:center;border-bottom:1px solid #eee;padding:8px 0}</style></head><body>
<div id="app"></div>
<script>
var URL_='YOUR_SUPABASE_URL',KEY='YOUR_ANON_KEY',sb=supabase.createClient(URL_,KEY);
var T={posts:{label:'Blog',f:['title','category','excerpt','!body','image_url','read_min','?published'],show:'title'},
projects:{label:'Portfolio',f:['title','kind','image_url','sort'],show:'title'},
reviews:{label:'Reviews',f:['name','role','book','rating','!text','?approved'],show:'name'},
content:{label:'Page text',f:['key','!value'],show:'key',pk:'key'},
products:{label:'Products',f:['name','plan','price_kobo','days','?active'],show:'name'},
orders:{label:'Orders',f:['ref','email','amount_kobo','status','code'],show:'email'},
codes:{label:'Codes',f:['code','status','expires_at','order_ref'],show:'code'}};
var cur='posts',app=document.getElementById('app');
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
async function init(){var s=(await sb.auth.getSession()).data.session;if(!s)return login();shell()}
function login(){app.innerHTML='<main><div class="c"><h2>Admin login</h2><label>Email</label><input id=e><label>Password</label><input id=p type=password><button onclick="go()">Log in</button> <span id=m></span></div></main>'}
async function go(){var r=await sb.auth.signInWithPassword({email:e.value,password:p.value});if(r.error)m.textContent=r.error.message;else init()}
function shell(){app.innerHTML='<header><b>CMS</b>'+Object.keys(T).map(function(k){return'<button class="t '+(k==cur?'on':'')+'" onclick="cur=\''+k+'\';shell()">'+T[k].label+'</button>'}).join('')+'<button class=g onclick="sb.auth.signOut().then(init)">Log out</button></header><main id=mn></main>';list()}
async function list(){var t=T[cur],r=await sb.from(cur).select('*').limit(200);var d=r.data||[];window._d=d;
mn.innerHTML='<div class=c><button onclick="edit()">+ New</button></div><div class=c>'+(r.error?esc(r.error.message):d.map(function(x,i){return'<div class=row><span>'+esc(x[t.show])+'</span><span><button class=g onclick="edit('+i+')">Edit</button> <button class=r onclick="del('+i+')">Delete</button></span></div>'}).join('')||'Nothing yet')+'</div>'}
function edit(i){var t=T[cur],x=i==null?{}:_d[i];window._i=i;
mn.innerHTML='<div class=c>'+t.f.map(function(f){var n=f.replace(/[!?]/,''),v=x[n];
if(f[0]=='?')return'<label><input type=checkbox id=f_'+n+(v!==false&&(v||i==null)?' checked':'')+' style="width:auto"> '+n+'</label><br>';
if(f[0]=='!')return'<label>'+n+'</label><textarea rows=8 id=f_'+n+'>'+esc(v)+'</textarea>';
return'<label>'+n+'</label><input id=f_'+n+' value="'+esc(v)+'">'}).join('')+'<button onclick="save()">Save</button> <button class=g onclick="list()">Cancel</button></div>'}
async function save(){var t=T[cur],o={};t.f.forEach(function(f){var n=f.replace(/[!?]/,''),el=document.getElementById('f_'+n);o[n]=f[0]=='?'?el.checked:(el.value===''?null:el.value)});
var old=_i==null?null:_d[_i],r=old?await sb.from(cur).update(o).eq(t.pk||'id',old[t.pk||'id']):await sb.from(cur).insert(o);
if(r.error)alert(r.error.message);else list()}
async function del(i){if(!confirm('Delete?'))return;var k=T[cur].pk||'id';await sb.from(cur).delete().eq(k,_d[i][k]);list()}
init();
</script></body></html>
