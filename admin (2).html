<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>*{box-sizing:border-box}body{font:14px system-ui;margin:0;background:#f4f1fa;color:#1d1530}.lay{display:flex;min-height:100vh}aside{width:210px;background:#150d33;color:#fff;padding:14px 10px;flex-shrink:0}aside a{display:flex;justify-content:space-between;color:#cfc8ea;padding:9px 12px;border-radius:8px;cursor:pointer;text-decoration:none}aside a.on,aside a:hover{background:#2a1d63;color:#fff}aside i{background:#f97316;color:#fff;border-radius:99px;padding:0 7px;font-style:normal;font-size:11px}.lg{display:block;padding:8px 12px 16px;font-size:17px}main{flex:1;padding:22px;max-width:980px}h2{margin:0 0 14px}button{border:0;border-radius:8px;padding:8px 14px;cursor:pointer;background:#f97316;color:#fff;font-weight:600}button.g{background:#ddd;color:#222}button.r{background:#dc2626}.c{background:#fff;border-radius:12px;padding:16px;margin:12px 0}.g4{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.g4 .c{margin:0}.g4 h3{margin:6px 0 0;font-size:22px}input,textarea,select{width:100%;padding:8px;margin:4px 0 10px;border:1px solid #ccc;border-radius:6px;font:inherit}label{font-size:12px;color:#555;display:block}.row{display:flex;justify-content:space-between;gap:10px;align-items:center;border-bottom:1px solid #eee;padding:8px 0}.ib{display:grid;grid-template-columns:260px 1fr;gap:12px}.th{cursor:pointer}.msgs{max-height:380px;overflow:auto;margin-bottom:10px}.b{max-width:80%;padding:8px 12px;border-radius:12px;margin:6px 0;background:#eee}.b.admin{background:#f97316;color:#fff;margin-left:auto}.b small{display:block;opacity:.7;font-size:10px}@media(max-width:760px){.lay{flex-direction:column}aside{width:100%;display:flex;flex-wrap:wrap}.ib{grid-template-columns:1fr}}</style></head><body><div id="app"></div>
<script>
var URL_='YOUR_SUPABASE_URL',KEY='YOUR_ANON_KEY',sb=supabase.createClient(URL_,KEY),app=document.getElementById('app'),V='dash',TH=null,RT=0;
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var T={posts:{label:'Blog',f:['title','category','excerpt','!body','image_url','read_min','?published'],show:'title'},projects:{label:'Portfolio',f:['title','kind','image_url','sort'],show:'title'},reviews:{label:'Reviews',f:['name','role','book','rating','!text','?approved'],show:'name'},products:{label:'Products',f:['name','plan','price_kobo','days','?active'],show:'name'},orders:{label:'Orders',f:['ref','email','amount_kobo','status','code'],show:'email'},codes:{label:'Codes',f:['code','status','expires_at','order_ref'],show:'code'}};
var NAV=[['dash','Dashboard'],['inbox','Inbox'],['notifs','Notifications'],['pages','Pages'],['text','Site text'],['set','Settings']].concat(Object.keys(T).map(function(k){return[k,T[k].label]}));
async function init(){var s=(await sb.auth.getSession()).data.session;if(!s)return login();shell();rt()}
function login(){app.innerHTML='<main><div class="c"><h2>Admin login</h2><label>Email</label><input id=e><label>Password</label><input id=p type=password><button onclick="go()">Log in</button> <span id=m></span></div></main>'}
async function go(){var r=await sb.auth.signInWithPassword({email:$('e').value,password:$('p').value});if(r.error)$('m').textContent=r.error.message;else init()}
function rt(){if(RT)return;RT=1;sb.channel('rt').on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},function(){side();if(V=='inbox'&&!document.activeElement.id)inbox()}).on('postgres_changes',{event:'INSERT',schema:'public',table:'notifications'},side).subscribe()}
async function side(){var a=await sb.from('threads').select('id',{count:'exact',head:true}).eq('unread',true),b=await sb.from('notifications').select('id',{count:'exact',head:true}).eq('read',false),bd={inbox:a.count,notifs:b.count};
$('sd').innerHTML='<b class=lg>Admin</b>'+NAV.map(function(n){return'<a class="'+(V==n[0]?'on':'')+'" onclick="V=\''+n[0]+'\';shell()">'+n[1]+(bd[n[0]]?' <i>'+bd[n[0]]+'</i>':'')+'</a>'}).join('')+'<a href="/" target=_blank>View site &#8599;</a><a onclick="sb.auth.signOut().then(init)">Log out</a>'}
function shell(){app.innerHTML='<div class=lay><aside id=sd></aside><main id=mn></main></div>';side();view()}
function view(){if(T[V])return crud();({dash:dash,inbox:inbox,notifs:notifs,pages:pages,text:text,set:settings})[V]()}
async function dash(){var o=(await sb.from('orders').select('amount_kobo').eq('status','paid')).data||[],pr=await sb.from('reviews').select('id',{count:'exact',head:true}).eq('approved',false),ps=await sb.from('posts').select('id',{count:'exact',head:true}),n=(await sb.from('notifications').select('*').order('created_at',{ascending:false}).limit(8)).data||[],rev=o.reduce(function(a,x){return a+(x.amount_kobo||0)},0)/100;
$('mn').innerHTML='<h2>Dashboard</h2><div class=g4>'+[['Revenue','₦'+rev.toLocaleString()],['Paid orders',o.length],['Reviews to approve',pr.count||0],['Blog posts',ps.count||0]].map(function(c){return'<div class=c><small>'+c[0]+'</small><h3>'+c[1]+'</h3></div>'}).join('')+'</div><div class=c><b>Recent activity</b>'+(n.map(function(x){return'<div class=row><span>'+esc(x.title)+'<br><small>'+esc(x.body)+'</small></span><small>'+new Date(x.created_at).toLocaleString()+'</small></div>'}).join('')||'<p>Nothing yet</p>')+'</div>'}
async function inbox(){var t=(await sb.from('threads').select('*').order('last_at',{ascending:false})).data||[];
$('mn').innerHTML='<h2>Inbox</h2><div class=ib><div class=c>'+(t.map(function(x){return'<div class="row th" onclick="openT(\''+x.id+'\')"><span>'+(x.unread?'&#9679; ':'')+esc(x.name||'Visitor')+'<br><small>'+esc(x.email||'')+'</small></span></div>'}).join('')||'No messages yet')+'</div><div class=c id=cv>Select a conversation</div></div>';if(TH)openT(TH,1)}
async function openT(id,keep){TH=id;var m=(await sb.from('messages').select('*').eq('thread_id',id).order('created_at')).data||[];
$('cv').innerHTML='<div class=msgs>'+m.map(function(x){return'<div class="b '+x.sender+'">'+esc(x.body)+'<small>'+new Date(x.created_at).toLocaleString()+'</small></div>'}).join('')+'</div><textarea id=rp rows=3 placeholder="Reply..."></textarea><button onclick="reply()">Send reply</button>';
var u=await sb.from('threads').update({unread:false}).eq('id',id);if(!keep)side()}
async function reply(){var b=$('rp').value.trim();if(!b)return;await sb.from('messages').insert({thread_id:TH,sender:'admin',body:b});openT(TH,1)}
async function notifs(){var n=(await sb.from('notifications').select('*').order('created_at',{ascending:false}).limit(100)).data||[];
$('mn').innerHTML='<h2>Notifications</h2><div class=c><button onclick="allread()">Mark all as read</button></div><div class=c>'+(n.map(function(x){return'<div class=row><span>'+(x.read?'':'&#9679; ')+'<b>'+esc(x.title)+'</b><br><small>'+esc(x.body)+'</small></span><small>'+new Date(x.created_at).toLocaleString()+'</small></div>'}).join('')||'Nothing yet')+'</div>'}
async function allread(){await sb.from('notifications').update({read:true}).eq('read',false);side();notifs()}
async function pages(){var d=(await sb.from('pages').select('*').order('sort')).data||[];window._pl=d;
$('mn').innerHTML='<h2>Pages</h2><div class=c><button onclick="pedit()">+ New page</button> <small>A page with slug "team" appears at yoursite/#team</small></div><div class=c>'+(d.map(function(x,i){return'<div class=row><span>'+esc(x.title)+' <small>#'+esc(x.slug)+'</small></span><span><button class=g onclick="pedit('+i+')">Edit</button> <button class=r onclick="pdel('+i+')">Delete</button></span></div>'}).join('')||'No pages yet')+'</div>'}
function pedit(i){window._pg=i==null?{title:'',slug:'',blocks:[],published:true,in_nav:true,sort:0}:JSON.parse(JSON.stringify(_pl[i]));prender()}
function cap(){var x=_pg;if(!$('pt'))return;x.title=$('pt').value;x.slug=$('ps').value;x.in_nav=$('pn').checked;x.published=$('pp').checked}
function prender(){var x=_pg,ty=['hero','text','cards','image','button','html'];
$('mn').innerHTML='<h2>'+(x.id?'Edit':'New')+' page</h2><div class=c><label>Title</label><input id=pt value="'+esc(x.title)+'"><label>Slug (letters, numbers, hyphens)</label><input id=ps value="'+esc(x.slug)+'"><label><input type=checkbox id=pn '+(x.in_nav?'checked':'')+' style="width:auto"> Show in menu</label><label><input type=checkbox id=pp '+(x.published?'checked':'')+' style="width:auto"> Published</label></div>'+
x.blocks.map(function(b,k){return'<div class=c><div class=row><b>Block '+(k+1)+'</b><span><button class=g onclick="bmv('+k+',-1)">&#8593;</button> <button class=g onclick="bmv('+k+',1)">&#8595;</button> <button class=r onclick="bdel('+k+')">&#10005;</button></span></div><label>Type</label><select onchange="bset('+k+',\'type\',this.value)">'+ty.map(function(t){return'<option'+(b.type==t?' selected':'')+'>'+t+'</option>'}).join('')+'</select>'+
[['title','Title'],['body',b.type=='cards'?'Cards (one per line: Title | text)':b.type=='html'?'HTML':'Text'],['image','Image URL'],['label','Button label'],['link','Button link (e.g. #contact)']].map(function(f){return'<label>'+f[1]+'</label>'+(f[0]=='body'?'<textarea rows=4 onchange="bset('+k+',\'body\',this.value)">'+esc(b.body)+'</textarea>':'<input value="'+esc(b[f[0]])+'" onchange="bset('+k+',\''+f[0]+'\',this.value)">')}).join('')+'</div>'}).join('')+
'<div class=c><button class=g onclick="badd()">+ Add block</button></div><button onclick="psave()">Save page</button> <button class=g onclick="pages()">Cancel</button>'}
function bset(k,f,v){_pg.blocks[k][f]=v}
function badd(){cap();_pg.blocks.push({type:'text',title:'',body:''});prender()}
function bdel(k){cap();_pg.blocks.splice(k,1);prender()}
function bmv(k,d){cap();var b=_pg.blocks,j=k+d;if(j<0||j>=b.length)return;var t=b[k];b[k]=b[j];b[j]=t;prender()}
async function psave(){cap();var x=_pg;x.slug=x.slug.toLowerCase().replace(/[^a-z0-9-]/g,'-');var o={title:x.title,slug:x.slug,blocks:x.blocks,published:x.published,in_nav:x.in_nav,sort:x.sort||0},r=x.id?await sb.from('pages').update(o).eq('id',x.id):await sb.from('pages').insert(o);if(r.error)alert(r.error.message);else pages()}
async function pdel(i){if(confirm('Delete page?')){await sb.from('pages').delete().eq('id',_pl[i].id);pages()}}
async function cmap(){var C={};((await sb.from('content').select('*')).data||[]).forEach(function(x){C[x.key]=x.value});return C}
async function text(){$('mn').innerHTML='<h2>Site text</h2><p>Scanning your pages...</p>';var C=await cmap(),out='';window._tx=[];
for(var r of['home','about','services','tools','blog','portfolio','contact']){var f=document.createElement('iframe');f.style.cssText='position:absolute;left:-9999px;width:1200px;height:800px';f.src='/index.html?raw=1#'+r;document.body.appendChild(f);await new Promise(function(ok){f.onload=function(){setTimeout(ok,1200)}});
var d=f.contentDocument,seen={},w=d.createTreeWalker(d.body,NodeFilter.SHOW_TEXT),n,l=[];
while(n=w.nextNode()){if(n.parentNode.closest('script,style,noscript,textarea'))continue;var t=n.nodeValue.trim();if(t.length>1&&!seen[t]){seen[t]=1;l.push(t)}}
f.remove();out+='<div class=c><b>'+r.toUpperCase()+'</b>'+l.map(function(t){var i=_tx.push(t)-1;return'<label>'+esc(t.slice(0,80))+'</label><input data-i='+i+' value="'+esc(C['txt:'+t]!=null?C['txt:'+t]:t)+'">'}).join('')+'</div>'}
window._C=C;$('mn').innerHTML='<h2>Site text</h2><p>Edit any text on your site, then Save.</p><button onclick="tsave()">Save all</button>'+out+'<button onclick="tsave()">Save all</button>'}
async function tsave(){var ch={},keep={};document.querySelectorAll('input[data-i]').forEach(function(el){var o=_tx[+el.dataset.i];if(el.value!==o){if(!ch[o])ch[o]=el.value}else keep[o]=1});
for(var o in ch)await sb.from('content').upsert({key:'txt:'+o,value:ch[o]});
for(var k in _C)if(k.indexOf('txt:')==0){var o2=k.slice(4);if(!ch[o2]&&keep[o2])await sb.from('content').delete().eq('key',k)}
alert('Saved. Refresh your site to see changes.');text()}
async function settings(){var C=await cmap();$('mn').innerHTML='<h2>Settings</h2><div class=c><label>Accent colour</label><input type=color id=s1 value="'+(C['set:accent']||'#f97316')+'"><label>Announcement bar text (leave empty to hide)</label><input id=s2 value="'+esc(C['set:announcement']||'')+'"><button onclick="sset()">Save</button></div>'}
async function sset(){await sb.from('content').upsert([{key:'set:accent',value:$('s1').value},{key:'set:announcement',value:$('s2').value}]);alert('Saved')}
async function crud(){var t=T[V],r=await sb.from(V).select('*').limit(200),d=r.data||[];window._d=d;
$('mn').innerHTML='<h2>'+t.label+'</h2><div class=c><button onclick="edit()">+ New</button></div><div class=c>'+(r.error?esc(r.error.message):d.map(function(x,i){return'<div class=row><span>'+esc(x[t.show])+'</span><span><button class=g onclick="edit('+i+')">Edit</button> <button class=r onclick="del('+i+')">Delete</button></span></div>'}).join('')||'Nothing yet')+'</div>'}
function edit(i){var t=T[V],x=i==null?{}:_d[i];window._i=i;
$('mn').innerHTML='<div class=c>'+t.f.map(function(f){var n=f.replace(/[!?]/,''),v=x[n];if(f[0]=='?')return'<label><input type=checkbox id=f_'+n+((i==null||v)?' checked':'')+' style="width:auto"> '+n+'</label>';if(f[0]=='!')return'<label>'+n+'</label><textarea rows=8 id=f_'+n+'>'+esc(v)+'</textarea>';return'<label>'+n+'</label><input id=f_'+n+' value="'+esc(v)+'">'}).join('')+'<button onclick="save()">Save</button> <button class=g onclick="crud()">Cancel</button></div>'}
async function save(){var t=T[V],o={};t.f.forEach(function(f){var n=f.replace(/[!?]/,''),el=$('f_'+n);o[n]=f[0]=='?'?el.checked:(el.value===''?null:el.value)});var old=_i==null?null:_d[_i],r=old?await sb.from(V).update(o).eq('id',old.id):await sb.from(V).insert(o);if(r.error)alert(r.error.message);else crud()}
async function del(i){if(!confirm('Delete?'))return;await sb.from(V).delete().eq('id',_d[i].id);crud()}
init();
</script></body></html>
